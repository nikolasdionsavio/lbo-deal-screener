services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lbo
      POSTGRES_PASSWORD: lbo_dev_password
      POSTGRES_DB: lbo_screener
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lbo -d lbo_screener"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://lbo:lbo_dev_password@db:5432/lbo_screener
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      DATA_PROVIDER: ${DATA_PROVIDER:-auto}
      SEC_EDGAR_USER_AGENT: ${SEC_EDGAR_USER_AGENT:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
